services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://ticket_user:ticket_password@postgres:5432/ticket_platform
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  mini-app:
    build:
      context: ./mini-app
      args:
        VITE_API_URL: /api
    ports:
      - "8080:80"
    depends_on:
      - backend

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ticket_platform
      POSTGRES_USER: ticket_user
      POSTGRES_PASSWORD: ticket_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
