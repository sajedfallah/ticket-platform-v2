name: Runtime Smoke

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'mini-app/**'
      - 'docker-compose.yml'
      - '.github/workflows/runtime-smoke.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'mini-app/**'
      - 'docker-compose.yml'
      - '.github/workflows/runtime-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build and start application
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Show container status
        run: docker compose ps

      - name: Verify backend health
        run: |
          curl --fail --show-error --silent http://localhost:8000/health | tee backend-health.json
          grep -q '"status":"ok"' backend-health.json

      - name: Verify event catalog
        run: |
          curl --fail --show-error --silent http://localhost:8000/api/events | tee events.json
          grep -q 'Ticket Platform Demo Event' events.json

      - name: Verify Mini App shell
        run: |
          curl --fail --show-error --silent http://localhost:8080/ | tee mini-app.html
          grep -q '<div id="root"></div>' mini-app.html

      - name: Verify Mini App API proxy
        run: |
          curl --fail --show-error --silent http://localhost:8080/api/events | tee proxied-events.json
          grep -q 'Ticket Platform Demo Event' proxied-events.json

      - name: Execute purchase and ticket journey
        run: |
          python - <<'PY'
          import json
          import urllib.request

          BASE = "http://localhost:8000/api"

          def request(method, path, payload=None):
              data = None
              headers = {}
              if payload is not None:
                  data = json.dumps(payload).encode()
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(BASE + path, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=15) as response:
                  return json.load(response)

          events = request("GET", "/events")
          event = events["items"][0]

          order = request(
              "POST",
              "/orders",
              {
                  "user_id": 1001,
                  "event_id": event["id"],
                  "ticket_type_id": event["ticket_type_id"],
                  "quantity": 1,
              },
          )

          payment = request(
              "POST",
              "/payments/create",
              {
                  "order_id": order["id"],
                  "callback_url": "http://localhost:8080/payment-result",
              },
          )

          verified = request(
              "POST",
              "/payments/verify",
              {"payment_id": payment["payment_id"], "success": True},
          )

          ticket = verified.get("ticket")
          assert verified["order_status"] == "paid", verified
          assert ticket and ticket["status"] == "active", verified

          checked_in = request(
              "POST",
              "/tickets/check-in",
              {"ticket_code": ticket["ticket_code"]},
          )
          assert checked_in["entry_allowed"] is True, checked_in

          evidence = {
              "event_id": event["id"],
              "order_id": order["id"],
              "payment_id": payment["payment_id"],
              "ticket_code": ticket["ticket_code"],
              "check_in": "accepted",
          }
          with open("purchase-flow.json", "w", encoding="utf-8") as handle:
              json.dump(evidence, handle, indent=2)
          print(json.dumps(evidence, indent=2))
          PY

      - name: Write smoke summary
        if: always()
        run: |
          {
            echo '# Runtime Smoke Report'
            echo
            echo '- Commit: `${{ github.sha }}`'
            echo '- Compose configuration: checked'
            echo '- Backend health: exercised'
            echo '- Mini App shell and API proxy: exercised'
            if [ -f purchase-flow.json ]; then
              echo '- Purchase journey: event → order → mock payment → ticket → check-in exercised'
              echo
              echo '```json'
              cat purchase-flow.json
              echo '```'
            else
              echo '- Purchase journey: no success evidence produced'
            fi
            echo
            docker compose ps || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture logs on failure
        if: failure()
        run: docker compose logs --no-color > runtime-smoke.log

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke-${{ github.sha }}
          path: |
            backend-health.json
            events.json
            proxied-events.json
            purchase-flow.json
            runtime-smoke.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Stop application
        if: always()
        run: docker compose down --volumes --remove-orphans
