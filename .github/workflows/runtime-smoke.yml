name: Runtime Smoke

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'mini-app/**'
      - 'docker-compose.yml'
      - '.github/workflows/runtime-smoke.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'mini-app/**'
      - 'docker-compose.yml'
      - '.github/workflows/runtime-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build and start application
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Show container status
        run: docker compose ps

      - name: Verify backend health
        run: |
          curl --fail --show-error --silent http://localhost:8000/health | tee backend-health.json
          grep -q '"status":"ok"' backend-health.json

      - name: Verify event catalog
        run: |
          curl --fail --show-error --silent http://localhost:8000/api/events | tee events.json
          grep -q 'Ticket Platform Demo Event' events.json

      - name: Verify Mini App shell
        run: |
          curl --fail --show-error --silent http://localhost:8080/ | tee mini-app.html
          grep -q '<div id="root"></div>' mini-app.html

      - name: Verify Mini App API proxy
        run: |
          curl --fail --show-error --silent http://localhost:8080/api/events | tee proxied-events.json
          grep -q 'Ticket Platform Demo Event' proxied-events.json

      - name: Write smoke summary
        if: always()
        run: |
          {
            echo '# Runtime Smoke Report'
            echo
            echo '- Commit: `${{ github.sha }}`'
            echo '- Compose configuration: checked'
            echo '- Backend target: `http://localhost:8000/health`'
            echo '- Mini App target: `http://localhost:8080/`'
            echo '- Mini App API proxy: `http://localhost:8080/api/events`'
            echo
            docker compose ps || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture logs on failure
        if: failure()
        run: docker compose logs --no-color > runtime-smoke.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke-${{ github.sha }}
          path: runtime-smoke.log
          retention-days: 30

      - name: Stop application
        if: always()
        run: docker compose down --volumes --remove-orphans
