name: Backend Verification

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'tests/**'
      - '.github/workflows/backend-test.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'tests/**'
      - '.github/workflows/backend-test.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ticket_platform_test
          POSTGRES_USER: ticket_test
          POSTGRES_PASSWORD: ticket_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticket_test -d ticket_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://ticket_test:ticket_test_password@localhost:5432/ticket_platform_test
      PYTHONPATH: ${{ github.workspace }}/backend
      VERIFICATION_REPORT_FILE: verification-report.md

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run backend verification
        run: bash scripts/verify_backend.sh

      - name: Publish verification summary
        if: always()
        run: |
          if [ -f verification-report.md ]; then
            cat verification-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '# Backend Verification Report\n\n- ❌ Verification report was not created.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-verification-${{ github.sha }}
          path: backend/verification-report.md
          if-no-files-found: warn
          retention-days: 30
